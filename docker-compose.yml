services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu_dev_password
      POSTGRES_DB: edu_platform
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"   # bound to loopback only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edu_platform"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "edu_dev_redis", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
